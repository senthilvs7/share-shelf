<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share shelf index</title>
<style>
:root {
  --bg: #fbfaf8; --fg: #1f1d1a; --muted: #6b665f; --line: #dcd7cf;
  --accent: #1d4ed8; --hover: #f1eee8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --fg: #ece8e1; --muted: #9a948b; --line: #35322e;
    --accent: #8ab4ff; --hover: #211f1c;
  }
}
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 52rem; margin: 0 auto; padding: 2rem 16px 4rem; }
h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
.count { color: var(--muted); margin: 0 0 1.25rem; }
input { width: 100%; box-sizing: border-box; padding: .6rem .75rem; font: inherit;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line);
  vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
tr:hover td { background: var(--hover); }
td.date { white-space: nowrap; color: var(--muted); }
a { color: var(--accent); }
.hint { color: var(--muted); font-size: .85rem; margin: 0 0 1rem; }
.path { display: block; color: var(--muted); font-size: .8rem; word-break: break-all; }
button { font: inherit; font-size: .85rem; padding: .25rem .6rem; cursor: pointer;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.empty { color: var(--muted); margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
<h1>Share shelf</h1>
<p class="count" id="count"></p>
<p class="hint">The title opens the copy on this computer. The address below it is the live link to share; it works after a push and deploy.</p>
<input id="q" type="search" placeholder="Search title or path" aria-label="Search artifacts" autofocus>
<table>
<thead><tr><th>Artifact</th><th>Added</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="empty" id="empty" hidden>No artifacts match.</p>
</main>
<script>
const ROWS = __ROWS__;
const PREFIX = __PREFIX__;
const BASE = __BASE__;
const rows = document.getElementById("rows");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const q = document.getElementById("q");

function absolute(path) {
  return BASE ? BASE + path : new URL(PREFIX + path, location.href).href;
}

function draw() {
  const term = q.value.trim().toLowerCase();
  const shown = ROWS.filter(r => (r.title + " " + r.path).toLowerCase().includes(term));
  count.textContent = shown.length === ROWS.length
    ? ROWS.length + (ROWS.length === 1 ? " live artifact" : " live artifacts")
    : shown.length + " of " + ROWS.length + " live artifacts";
  rows.textContent = "";
  for (const r of shown) {
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    const a = document.createElement("a");
    a.href = PREFIX + r.path;
    a.textContent = r.title;
    const p = document.createElement("a");
    p.className = "path";
    p.href = absolute(r.path);
    p.target = "_blank";
    p.rel = "noopener";
    p.textContent = absolute(r.path);
    name.append(a, p);
    const date = document.createElement("td");
    date.className = "date";
    date.textContent = r.date;
    const act = document.createElement("td");
    const b = document.createElement("button");
    b.textContent = "Copy link";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(absolute(r.path)); b.textContent = "Copied"; }
      catch (e) { b.textContent = "Copy failed"; }
      setTimeout(() => { b.textContent = "Copy link"; }, 1500);
    });
    act.append(b);
    tr.append(name, date, act);
    rows.append(tr);
  }
  empty.hidden = shown.length > 0;
}

q.addEventListener("input", draw);
draw();
</script>
</body>
</html>
